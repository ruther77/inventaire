<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hors ligne - Inventaire Épicerie</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      text-align: center;
      max-width: 500px;
      width: 100%;
    }

    .icon-container {
      margin-bottom: 2rem;
      animation: float 3s ease-in-out infinite;
    }

    .icon {
      width: 120px;
      height: 120px;
      margin: 0 auto;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      border-radius: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 20px 60px rgba(59, 130, 246, 0.3);
    }

    .icon svg {
      width: 60px;
      height: 60px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    h1 {
      font-size: 2rem;
      font-weight: 700;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    p {
      font-size: 1.125rem;
      color: #94a3b8;
      margin-bottom: 2rem;
      line-height: 1.6;
    }

    .info {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 1.5rem;
      margin-top: 2rem;
    }

    .info-title {
      font-size: 0.875rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .info-text {
      font-size: 0.9375rem;
      color: #94a3b8;
      margin: 0;
    }

    .retry-button {
      display: inline-block;
      background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
      color: white;
      padding: 1rem 2rem;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 600;
      font-size: 1rem;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 10px 30px rgba(59, 130, 246, 0.3);
      border: none;
      cursor: pointer;
    }

    .retry-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 40px rgba(59, 130, 246, 0.4);
    }

    .retry-button:active {
      transform: translateY(0);
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    @media (max-width: 640px) {
      h1 {
        font-size: 1.5rem;
      }

      p {
        font-size: 1rem;
      }

      .icon {
        width: 100px;
        height: 100px;
      }

      .icon svg {
        width: 50px;
        height: 50px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon-container">
      <div class="icon">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>

    <h1>Vous êtes hors ligne</h1>

    <p>
      L'application Inventaire Épicerie nécessite une connexion Internet pour fonctionner.
    </p>

    <button class="retry-button" onclick="window.location.reload()">
      Réessayer
    </button>

    <div class="info">
      <div class="info-title">Mode hors ligne</div>
      <div class="info-text">
        Certaines fonctionnalités sont disponibles hors ligne si vous avez déjà visité l'application.
        Vérifiez votre connexion Internet et réessayez.
      </div>
    </div>
  </div>

  <script>
    // Vérifier périodiquement si la connexion est rétablie
    let isOnline = navigator.onLine;

    window.addEventListener('online', () => {
      // Recharger automatiquement quand la connexion revient
      window.location.reload();
    });

    window.addEventListener('offline', () => {
      isOnline = false;
    });

    // Vérifier toutes les 5 secondes
    setInterval(() => {
      if (navigator.onLine && !isOnline) {
        window.location.reload();
      }
    }, 5000);
  </script>
</body>
</html>
