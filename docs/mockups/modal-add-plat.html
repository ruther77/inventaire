<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal - Ajouter un plat</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a0f;
            --text-primary: #ffffff;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.15);
            --accent-orange: #f97316;
            --accent-amber: #f59e0b;
            --accent-emerald: #10b981;
            --accent-rose: #f43f5e;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal {
            background: rgba(20, 20, 30, 0.95);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 700px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.1), rgba(245, 158, 11, 0.05));
        }
        .modal-title {
            font-family: 'Sora', sans-serif;
            font-size: 20px;
            font-weight: 600;
        }
        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }
        .modal-body { padding: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--accent-orange);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .section-title {
            font-size: 16px;
            font-weight: 600;
            margin: 24px 0 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border);
        }
        .ingredients-list {
            background: rgba(255,255,255,0.03);
            border-radius: 12px;
            padding: 16px;
        }
        .ingredient-row {
            display: grid;
            grid-template-columns: 2fr 1fr 80px 40px;
            gap: 12px;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .ingredient-row:last-child { border-bottom: none; }
        .remove-btn {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            background: rgba(244,63,94,0.1);
            border: none;
            color: var(--accent-rose);
            cursor: pointer;
            font-size: 16px;
        }
        .add-ingredient-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 12px;
            background: rgba(249,115,22,0.1);
            border: 1px dashed rgba(249,115,22,0.3);
            border-radius: 10px;
            color: var(--accent-orange);
            font-size: 14px;
            cursor: pointer;
            margin-top: 12px;
            width: 100%;
            justify-content: center;
        }
        .food-cost-preview {
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.1), rgba(245, 158, 11, 0.1));
            border: 1px solid rgba(249, 115, 22, 0.3);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
        }
        .cost-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
        }
        .cost-label { color: var(--text-muted); font-size: 14px; }
        .cost-value { font-weight: 600; font-size: 16px; }
        .cost-value.good { color: var(--accent-emerald); }
        .cost-value.warning { color: var(--accent-amber); }
        .cost-value.danger { color: var(--accent-rose); }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 24px;
            border-top: 1px solid var(--border);
        }
        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-primary {
            background: var(--accent-orange);
            border: none;
            color: white;
        }
    </style>
</head>
<body>
    <div class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">🍽️ Nouveau plat</h2>
                <button class="modal-close" onclick="alert('Fermer')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Nom du plat *</label>
                    <input type="text" class="form-input" placeholder="Ex: Entrecôte grillée sauce béarnaise">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Catégorie *</label>
                        <select class="form-select">
                            <option>Sélectionner...</option>
                            <option>Entrées</option>
                            <option>Plats</option>
                            <option>Desserts</option>
                            <option>Boissons</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Prix de vente TTC *</label>
                        <input type="number" class="form-input" placeholder="24.90" step="0.10">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Nombre de portions</label>
                        <input type="number" class="form-input" value="1">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Objectif Food Cost</label>
                        <input type="number" class="form-input" value="30" placeholder="%">
                    </div>
                </div>

                <div class="section-title">🥗 Composition du plat</div>
                <div class="ingredients-list">
                    <div class="ingredient-row" style="font-size: 12px; color: var(--text-muted); padding-bottom: 8px;">
                        <span>Ingrédient</span>
                        <span>Quantité</span>
                        <span>Unité</span>
                        <span></span>
                    </div>
                    <div class="ingredient-row">
                        <select class="form-select" style="padding: 8px 12px;">
                            <option>Entrecôte (bœuf)</option>
                        </select>
                        <input type="number" class="form-input" value="250" style="padding: 8px 12px;">
                        <span style="color: var(--text-muted);">g</span>
                        <button class="remove-btn">✕</button>
                    </div>
                    <div class="ingredient-row">
                        <select class="form-select" style="padding: 8px 12px;">
                            <option>Beurre</option>
                        </select>
                        <input type="number" class="form-input" value="30" style="padding: 8px 12px;">
                        <span style="color: var(--text-muted);">g</span>
                        <button class="remove-btn">✕</button>
                    </div>
                    <div class="ingredient-row">
                        <select class="form-select" style="padding: 8px 12px;">
                            <option>Estragon frais</option>
                        </select>
                        <input type="number" class="form-input" value="10" style="padding: 8px 12px;">
                        <span style="color: var(--text-muted);">g</span>
                        <button class="remove-btn">✕</button>
                    </div>
                    <button class="add-ingredient-btn" onclick="alert('Ajouter ingrédient')">
                        ➕ Ajouter un ingrédient
                    </button>
                </div>

                <div class="food-cost-preview">
                    <div style="font-size: 14px; font-weight: 600; margin-bottom: 12px;">📊 Aperçu Food Cost</div>
                    <div class="cost-row">
                        <span class="cost-label">Coût matière total</span>
                        <span class="cost-value">€6.97</span>
                    </div>
                    <div class="cost-row">
                        <span class="cost-label">Prix de vente</span>
                        <span class="cost-value">€24.90</span>
                    </div>
                    <div class="cost-row" style="border-top: 1px solid var(--border); padding-top: 12px; margin-top: 8px;">
                        <span class="cost-label">Food Cost</span>
                        <span class="cost-value good">28% ✓</span>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="alert('Annuler')">Annuler</button>
                <button class="btn btn-primary" onclick="alert('Plat créé !')">Créer le plat</button>
            </div>
        </div>
    </div>
</body>
</html>
