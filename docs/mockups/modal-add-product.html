<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal - Ajouter un produit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a0f;
            --text-primary: #ffffff;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.15);
            --accent-emerald: #10b981;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal {
            background: rgba(20, 20, 30, 0.95);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 560px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            border-bottom: 1px solid var(--border);
        }
        .modal-title {
            font-family: 'Sora', sans-serif;
            font-size: 20px;
            font-weight: 600;
        }
        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-close:hover { background: rgba(255,255,255,0.1); }
        .modal-body { padding: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        .form-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            transition: all 0.2s;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--accent-emerald);
            background: rgba(255,255,255,0.08);
        }
        .form-input::placeholder { color: var(--text-muted); }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .form-select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
        }
        .form-textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
            min-height: 100px;
            resize: vertical;
        }
        .barcode-section {
            display: flex;
            gap: 12px;
        }
        .barcode-section .form-input { flex: 1; }
        .scan-btn {
            padding: 12px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 14px;
            cursor: pointer;
        }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 24px;
            border-top: 1px solid var(--border);
        }
        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-secondary:hover { background: rgba(255,255,255,0.1); }
        .btn-primary {
            background: var(--accent-emerald);
            border: none;
            color: white;
        }
        .btn-primary:hover { background: #0d9668; }
    </style>
</head>
<body>
    <div class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">➕ Nouveau produit</h2>
                <button class="modal-close" onclick="alert('Fermer')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Nom du produit *</label>
                    <input type="text" class="form-input" placeholder="Ex: Tomates grappe bio">
                </div>
                <div class="form-group">
                    <label class="form-label">Code-barres / EAN</label>
                    <div class="barcode-section">
                        <input type="text" class="form-input" placeholder="3760123456789">
                        <button class="scan-btn">📷 Scanner</button>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Catégorie *</label>
                        <select class="form-select">
                            <option>Sélectionner...</option>
                            <option>Fruits & Légumes</option>
                            <option>Viandes</option>
                            <option>Poissons</option>
                            <option>Épicerie sèche</option>
                            <option>Boissons</option>
                            <option>Produits laitiers</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Sous-catégorie</label>
                        <select class="form-select">
                            <option>Sélectionner...</option>
                            <option>Légumes frais</option>
                            <option>Fruits frais</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Unité de mesure *</label>
                        <select class="form-select">
                            <option>kg</option>
                            <option>g</option>
                            <option>L</option>
                            <option>ml</option>
                            <option>pièce</option>
                            <option>lot</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Conditionnement</label>
                        <input type="text" class="form-input" placeholder="Ex: Cagette 5kg">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Prix d'achat HT</label>
                        <input type="number" class="form-input" placeholder="0.00" step="0.01">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Prix de vente TTC</label>
                        <input type="number" class="form-input" placeholder="0.00" step="0.01">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Stock minimum</label>
                        <input type="number" class="form-input" placeholder="10">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Stock maximum</label>
                        <input type="number" class="form-input" placeholder="100">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Fournisseur principal</label>
                    <select class="form-select">
                        <option>Sélectionner...</option>
                        <option>Metro France</option>
                        <option>Brake France</option>
                        <option>Pomona</option>
                    </select>
                </div>
                <div class="form-group">
                    <label class="form-label">Notes</label>
                    <textarea class="form-textarea" placeholder="Informations complémentaires..."></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="alert('Annuler')">Annuler</button>
                <button class="btn btn-primary" onclick="alert('Produit créé !')">Créer le produit</button>
            </div>
        </div>
    </div>
</body>
</html>
