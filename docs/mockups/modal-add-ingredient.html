<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modal - Ajouter un ingrédient</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-primary: #0a0a0f;
            --text-primary: #ffffff;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.15);
            --accent-orange: #f97316;
            --accent-emerald: #10b981;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal {
            background: rgba(20, 20, 30, 0.95);
            border: 1px solid var(--border);
            border-radius: 20px;
            width: 100%;
            max-width: 520px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 24px;
            border-bottom: 1px solid var(--border);
            background: linear-gradient(135deg, rgba(249, 115, 22, 0.1), transparent);
        }
        .modal-title {
            font-family: 'Sora', sans-serif;
            font-size: 20px;
            font-weight: 600;
        }
        .modal-close {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            background: rgba(255,255,255,0.06);
            border: none;
            color: var(--text-muted);
            font-size: 18px;
            cursor: pointer;
        }
        .modal-body { padding: 24px; }
        .form-group { margin-bottom: 20px; }
        .form-label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        .form-input, .form-select {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text-primary);
            font-size: 14px;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--accent-orange);
        }
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }
        .link-section {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            border-radius: 12px;
            padding: 16px;
            margin-top: 20px;
        }
        .link-title {
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 12px;
            color: var(--accent-emerald);
        }
        .link-search {
            display: flex;
            gap: 12px;
        }
        .link-search .form-input { flex: 1; }
        .link-btn {
            padding: 12px 16px;
            background: var(--accent-emerald);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 14px;
            cursor: pointer;
        }
        .linked-product {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: rgba(255,255,255,0.03);
            border-radius: 8px;
            margin-top: 12px;
        }
        .linked-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(16, 185, 129, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }
        .linked-info { flex: 1; }
        .linked-name { font-size: 14px; font-weight: 500; }
        .linked-ref { font-size: 12px; color: var(--text-muted); }
        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 24px;
            border-top: 1px solid var(--border);
        }
        .btn {
            padding: 12px 24px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }
        .btn-secondary {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }
        .btn-primary {
            background: var(--accent-orange);
            border: none;
            color: white;
        }
    </style>
</head>
<body>
    <div class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h2 class="modal-title">🥬 Nouvel ingrédient</h2>
                <button class="modal-close" onclick="alert('Fermer')">✕</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label class="form-label">Nom de l'ingrédient *</label>
                    <input type="text" class="form-input" placeholder="Ex: Tomates cerises">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Catégorie *</label>
                        <select class="form-select">
                            <option>Sélectionner...</option>
                            <option>Légumes</option>
                            <option>Fruits</option>
                            <option>Viandes</option>
                            <option>Poissons</option>
                            <option>Produits laitiers</option>
                            <option>Épices & Condiments</option>
                            <option>Féculents</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Unité de base *</label>
                        <select class="form-select">
                            <option>kg</option>
                            <option>g</option>
                            <option>L</option>
                            <option>ml</option>
                            <option>pièce</option>
                        </select>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Prix au kg/L</label>
                        <input type="number" class="form-input" placeholder="0.00" step="0.01">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Stock actuel</label>
                        <input type="number" class="form-input" placeholder="0">
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label class="form-label">Stock minimum</label>
                        <input type="number" class="form-input" placeholder="5">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Allergènes</label>
                        <select class="form-select">
                            <option>Aucun</option>
                            <option>Gluten</option>
                            <option>Lactose</option>
                            <option>Œufs</option>
                            <option>Fruits à coque</option>
                            <option>Crustacés</option>
                        </select>
                    </div>
                </div>

                <div class="link-section">
                    <div class="link-title">🔗 Lier à un produit épicerie</div>
                    <div class="link-search">
                        <input type="text" class="form-input" placeholder="Rechercher un produit...">
                        <button class="link-btn">Lier</button>
                    </div>
                    <div class="linked-product">
                        <div class="linked-icon">🍅</div>
                        <div class="linked-info">
                            <div class="linked-name">Tomates cerises barquette 500g</div>
                            <div class="linked-ref">REF: METRO-TC500 • €4.50/kg</div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="alert('Annuler')">Annuler</button>
                <button class="btn btn-primary" onclick="alert('Ingrédient créé !')">Créer l'ingrédient</button>
            </div>
        </div>
    </div>
</body>
</html>
