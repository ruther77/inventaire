services:
  db:
    image: public.ecr.aws/docker/library/postgres:16
    container_name: inventaire-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      # L'initialisation de la BDD avec le init.sql contenant le Trigger O(1)
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - inventaire-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  db-test:
    image: public.ecr.aws/docker/library/postgres:16
    container_name: inventaire-db-test
    restart: unless-stopped
    env_file:
      - .env.test
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_test_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "55432:5432"
    networks:
      - inventaire-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: public.ecr.aws/docker/library/adminer:latest
    container_name: inventaire-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inventaire-net

  backup:
    image: public.ecr.aws/docker/library/postgres:16
    container_name: inventaire-backup
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backup_data:/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    networks:
      - inventaire-net
    command: /bin/bash -c "while true; do /usr/local/bin/backup.sh; sleep 21600; done"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: inventaire-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
      NEWCMS_ALLOW_ANON: "1"            # mode démo pour newCMS (pas d'auth requise)
      NEWCMS_DEFAULT_TENANT_ID: "2"     # tenant par défaut pour newCMS (restaurant)
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - inventaire-net
    ports:
      - "8000:8000"  # API
      - "8502:8501"  # Optionnel: exposer un service streamlit interne si besoin de debug
    volumes:
      - backup_data:/backups
      - .:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventaire-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "5175:80"
    networks:
      - inventaire-net

  ngrok:
    image: ngrok/ngrok:latest
    container_name: inventaire-ngrok
    restart: unless-stopped
    command: http inventaire-frontend:80
    environment:
      - NGROK_AUTHTOKEN=36CRM3bhfuahmaHrrIOOzfyv72E_6nvkimDv98YXiptZR88WD
    ports:
      - "4040:4040"  # Dashboard ngrok local
    depends_on:
      - frontend
    networks:
      - inventaire-net

  n8n:
    image: n8nio/n8n
    container_name: inventaire-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Europe/Paris
      - N8N_IMPORT_EXPORT_DIR=/home/node/.n8n/import
      - N8N_IMPORT_EXPORT_AUTO_IMPORT=all
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme}
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./n8n_workflows:/home/node/.n8n/import:ro
    networks:
      - inventaire-net
    depends_on:
      api:
        condition: service_started
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama
    container_name: inventaire-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - inventaire-net

  blocks:
    build:
      context: ./blocks
      dockerfile: Dockerfile
      target: dev
    container_name: inventaire-blocks
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - HOSTNAME=0.0.0.0
    networks:
      - inventaire-net

  # === DISTRIBUTED SYSTEM INFRASTRUCTURE ===

  # Redis - Cache layer + Idempotency keys storage
  redis:
    image: redis:7-alpine
    container_name: inventaire-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - inventaire-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # RabbitMQ - Message broker for Celery workers
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: inventaire-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    ports:
      - "5672:5672"   # AMQP protocol
      - "15672:15672" # Management UI
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - inventaire-net
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # Celery Worker - Background task processing
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: inventaire-celery-worker
    restart: unless-stopped
    command: celery -A backend.worker worker --loglevel=info --concurrency=2
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - inventaire-net
    volumes:
      - .:/app

  # Celery Beat - Periodic task scheduler
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: inventaire-celery-beat
    restart: unless-stopped
    command: celery -A backend.worker beat --loglevel=info
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: amqp://${RABBITMQ_USER:-guest}:${RABBITMQ_PASSWORD:-guest}@rabbitmq:5672//
    depends_on:
      - celery-worker
    networks:
      - inventaire-net
    volumes:
      - .:/app

volumes:
  db_data:
  backup_data:
  db_test_data:
  redis_data:
  rabbitmq_data:
networks:
  inventaire-net:
    driver: bridge
