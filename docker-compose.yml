services:
  db:
    image: public.ecr.aws/docker/library/postgres:16
    container_name: inventaire-db
    restart: unless-stopped
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
      # L'initialisation de la BDD avec le init.sql contenant le Trigger O(1)
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - inventaire-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
  db-test:
    image: public.ecr.aws/docker/library/postgres:16
    container_name: inventaire-db-test
    restart: unless-stopped
    env_file:
      - .env.test
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_test_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "55432:5432"
    networks:
      - inventaire-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: public.ecr.aws/docker/library/adminer:latest
    container_name: inventaire-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inventaire-net

  backup:
    image: public.ecr.aws/docker/library/postgres:16
    container_name: inventaire-backup
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - backup_data:/backups
      - ./backup.sh:/usr/local/bin/backup.sh:ro
    networks:
      - inventaire-net
    command: /bin/bash -c "while true; do /usr/local/bin/backup.sh; sleep 21600; done"

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: inventaire-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEWCMS_ALLOW_ANON: "1"            # mode démo pour newCMS (pas d'auth requise)
      NEWCMS_DEFAULT_TENANT_ID: "2"     # tenant par défaut pour newCMS (restaurant)
    depends_on:
      db:
        condition: service_healthy
    networks:
      - inventaire-net
    ports:
      - "8000:8000"  # API
      - "8502:8501"  # Optionnel: exposer un service streamlit interne si besoin de debug
    volumes:
      - backup_data:/backups
      - .:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: inventaire-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_started
    ports:
      - "5175:80"
    networks:
      - inventaire-net
  
  n8n:
    image: n8nio/n8n
    container_name: inventaire-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - GENERIC_TIMEZONE=Europe/Paris
      - N8N_IMPORT_EXPORT_DIR=/home/node/.n8n/import
      - N8N_IMPORT_EXPORT_AUTO_IMPORT=all
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-true}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-changeme}
    volumes:
      - ./n8n_data:/home/node/.n8n
      - ./n8n_workflows:/home/node/.n8n/import:ro
    networks:
      - inventaire-net
    depends_on:
      api:
        condition: service_started
      ollama:
        condition: service_started

  ollama:
    image: ollama/ollama
    container_name: inventaire-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ./ollama_data:/root/.ollama
    networks:
      - inventaire-net


volumes:
  db_data:
  backup_data:
  db_test_data:
networks:
  inventaire-net:
    driver: bridge
